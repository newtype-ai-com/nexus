name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests (PostgreSQL tests skip without a database)
        # TestSelfConsciousEscCancelsContinuation is timing-dependent and flaky.
        run: go test -count=1 -skip '^TestSelfConsciousEscCancelsContinuation$' ./...
